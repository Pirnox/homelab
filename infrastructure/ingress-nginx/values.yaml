controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  # Single node — no need for multiple replicas
  replicaCount: 1
  resources:
    requests:
      memory: "90Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  # Allow snippets for local-network use
  allowSnippetAnnotations: true
  config:
    # Trust X-Forwarded-For from within the cluster
    use-forwarded-headers: "true"
