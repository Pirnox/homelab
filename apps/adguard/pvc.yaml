apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-config
  namespace: dns
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-data
  namespace: dns
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
