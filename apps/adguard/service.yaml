apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: dns
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/part-of: homelab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: adguard
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
    # DNS ports are bound directly via hostNetwork — no NodePort needed
